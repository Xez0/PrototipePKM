<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgIpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <pattern id="gridIpa" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bgIpa)"/>
  <rect width="640" height="360" fill="url(#gridIpa)"/>

  <!-- Science Biology Diagram Vectors -->
  <g transform="translate(460, 60)" opacity="0.35">
    <!-- DNA Helix / Molecule -->
    <path d="M40 20 C80 60 80 120 40 160 C0 200 0 240 40 280" fill="none" stroke="#a7f3d0" stroke-width="3"/>
    <path d="M80 20 C40 60 40 120 80 160 C120 200 120 240 80 280" fill="none" stroke="#6ee7b7" stroke-width="3"/>
    <line x1="45" y1="50" x2="75" y2="50" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="60" y1="90" x2="60" y2="90" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="45" y1="130" x2="75" y2="130" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="45" y1="190" x2="75" y2="190" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="45" y1="250" x2="75" y2="250" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="60" cy="90" r="14" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="60" cy="90" r="6" fill="#34d399"/>
  </g>

  <!-- Left Content Box -->
  <rect x="36" y="36" width="76" height="26" rx="6" fill="#059669"/>
  <text x="74" y="53" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">IPA</text>

  <text x="36" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff">Sistem Pencernaan</text>
  <text x="36" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#a7f3d0">Enzim &amp; Jalur Penyerapan Nutrisi</text>

  <!-- Grade Pill & Curriculum -->
  <rect x="36" y="160" width="76" height="24" rx="4" fill="#064e3b"/>
  <text x="74" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">KELAS 8</text>

  <rect x="120" y="160" width="136" height="24" rx="4" fill="#047857"/>
  <text x="188" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">KURIKULUM MERDEKA</text>

  <!-- Bottom School Branding Bar -->
  <rect x="36" y="300" width="568" height="28" rx="6" fill="#022c22" fill-opacity="0.8"/>
  <text x="50" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">UPTD SMPN 7 KOTA TANGERANG SELATAN</text>
  <text x="590" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="end">Agus Supratman, S.Pd.</text>
</svg>
